document.getElementById("form-busqueda").addEventListener("submit", function(event) {
    event.preventDefault();
    //resetea los elementos del mostrador, para ello borra todo el codigo de html que tiene dentro (si no se siguen apilando las busquedas)
    var element = document.getElementById("mostrador");
    element.innerHTML = "";

    const form = document.getElementById("form-busqueda");
    var formData = new FormData(form);

  


    var data = formData.get('busqueda');
    var busqueda = data.toLowerCase();
    console.log(busqueda);

    albums.forEach(element => {
        crearCancionesAlbumObjeto(element,busqueda);
    });



   
});

function agregarCarrito(idcancion){ 
    var count = JSON.parse(localStorage.getItem("cancionescarrito"));
        
    count.splice(idcancion, 99);

    if ((count.includes(idcancion)) == false)
   
        count.push(parseInt(idcancion));
        localStorage.setItem("cancionescarrito", JSON.stringify(count)); 
    
    
    }

    localStorage.setItem("albums", 
    JSON.stringify(albums)
)


const albumsgenerales = JSON.parse(localStorage.getItem("albums"));


function cover(AlbumObj){
    
    var cover = document.createElement("img");

    cover.setAttribute("src", AlbumObj.cover);
    cover.setAttribute("alt", (AlbumObj.name + "- " + AlbumObj.artist + " - Portada de album"));
    cover.setAttribute("height","200px"); 
    cover.setAttribute("width","200px"); 
    cover.setAttribute("class", 'covercancionbuscar');
    return cover;
}



function crearCancionesAlbumObjeto(albumObj, busqueda){
   
    var albumObjsongs = albumObj.songs;

    var Div = document.createElement('div');
        
    Div.setAttribute("class", "tracks_listados_buscar");
        
        for(let i = 0; i < albumObjsongs.length; i++) {
            
            var canciondentrodiv = document.createElement('div');
            canciondentrodiv.setAttribute("class", 'canciondentrodiv');

            canciondentrodiv.appendChild(cover(albumObj));
            

            var info = document.createElement("p");
                info.setAttribute("class", 'trackinfobuscar');
            info.innerHTML = (albumObjsongs[i].name + " <br /> " + albumObj.artist +" <br /> Duración: " + albumObjsongs[i].duration);
            canciondentrodiv.appendChild(info);

            var idboton = (albumObjsongs[i]).id;

            var btn = document.createElement("button");
                btn.setAttribute("class", 'trackinfoagregaralcarrito');
                btn.setAttribute("id", idboton);
                btn.setAttribute("style", "width: 120px; height: 80px");
                btn.setAttribute("onclick", "agregarCarrito(" + (albumObjsongs[i]).id + ")")
                btn.innerHTML = "Agregar al carrito";
            canciondentrodiv.appendChild(btn);
            
            var formulario = document.createElement("form");
            formulario.setAttribute("action", 'escuchartema.html');
            var btnVer = document.createElement("button");
            btnVer.setAttribute("class", 'verCancion');
            btnVer.setAttribute("name", 'idTema');
            btnVer.setAttribute("type", 'submit');
                btnVer.setAttribute("value", idboton);
            btnVer.setAttribute("style", "width: 120px; height: 80px");
            
            btnVer.innerHTML = "Escuchar tema";
            formulario.appendChild(btnVer);
            canciondentrodiv.appendChild(formulario);
            
                
                var formulario2 = document.createElement("form");
            formulario2.setAttribute("action", 'escucharalbum.html');
            var btnVerAlbum = document.createElement("button");
            btnVerAlbum.setAttribute("class", 'verCancion');
            btnVerAlbum.setAttribute("name", 'idAlbum');
            btnVerAlbum.setAttribute("type", 'submit');
                btnVerAlbum.setAttribute("value", albumObj.id);
            btnVerAlbum.setAttribute("style", "width: 120px; height: 80px");
            
            btnVerAlbum.innerHTML = "Ver album proveniente";
            formulario2.appendChild(btnVerAlbum);
            canciondentrodiv.appendChild(formulario2);
              
                
            //verificar si el nombre coincide con lo que busco pero que no sea igual, solo parecido por las primeras letras
            if (albumObjsongs[i].name.toLowerCase().indexOf(busqueda) !== -1) {
                Div.appendChild(canciondentrodiv);
            }

            var divmostrador = document.getElementById("mostrador");
                divmostrador.appendChild(Div);

        
        }

        var cancionesdiv = document.querySelectorAll(".canciondentrodiv");
        if (cancionesdiv.length == 0){
            document.getElementById("mostrador").innerHTML = "No se ha encontrado ningún tema con ese nombre ;( )";
    }
        
}
