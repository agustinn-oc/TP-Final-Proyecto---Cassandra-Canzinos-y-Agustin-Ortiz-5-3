<script>




function agregarCarrito(idAlbum){ 




    var album = albums.find(p => p.id === idAlbum);

    var canciones = album.songs;

   var count = JSON.parse(localStorage.getItem("cancionescarrito"));
    canciones.forEach(cancion =>{

    count.splice(cancion.id, 9999);
    if ((count.includes(cancion.id)) == false){
        count.push(parseInt(cancion.id));
    }
    });

    localStorage.setItem("cancionescarrito", JSON.stringify(count)); 

  
}

//ál pasar por cada album tener un contador de cuantas canciones se agregaron y fijarse si la cuenta de temas agregados del album es la misma que la cantidad de  temas que tiene el album y directamente agregar el album o algo yo que se

localStorage.setItem("albums", 
JSON.stringify(albums)
)


const albumsgenerales = JSON.parse(localStorage.getItem("albums"));
var albumObj = albumsgenerales[1];

//alert(albumObj.name);




function cover(AlbumObj){
    

var albumss = document.createElement("img");

albumss.setAttribute("src", AlbumObj.cover);
albumss.setAttribute("alt", (AlbumObj.name + "- " + AlbumObj.artist + " - Portada de album"));
albumss.setAttribute("height","200px"); 
albumss.setAttribute("width","200px"); 
albumss.setAttribute("class", 'covercancionbuscar');
return albumss;
}



function crearAlbumObjeto(albumObj, busqueda){
   


        var Div = document.createElement('div');
       
        Div.setAttribute("class", "listados_buscar");
        
       
                
        var albumdiv = document.createElement('div');
        albumdiv.setAttribute("class", 'albumdiv');
         

        albumdiv.appendChild(cover(albumObj));
     
        
            var info = document.createElement("p");
            info.setAttribute("class", 'trackinfobuscar');
            info.innerHTML = (albumObj.name + " <br /> " + albumObj.artist +" <br /> Precio: $" + albumObj.precio);
            albumdiv.appendChild(info);

            var idboton = albumObj.id;

            var btn = document.createElement("button");
                btn.setAttribute("class", 'albuminfoagregaralcarrito');
                btn.setAttribute("id", idboton);
                btn.setAttribute("style", "width: 120px; height: 80px");
                btn.setAttribute("onclick", "agregarCarrito(" + idboton + ")")
                btn.innerHTML = "Agregar al carrito";
            albumdiv.appendChild(btn);
                            
            var formulario2 = document.createElement("form");
            formulario2.setAttribute("action", 'escucharalbum.html');
            var btnVerAlbum = document.createElement("button");
            btnVerAlbum.setAttribute("class", 'verCancion');
            btnVerAlbum.setAttribute("name", 'idAlbum');
            btnVerAlbum.setAttribute("type", 'submit');
            btnVerAlbum.setAttribute("value", albumObj.id);
            btnVerAlbum.setAttribute("style", "width: 120px; height: 80px");
            
            btnVerAlbum.innerHTML = "Escuchar album";
            formulario2.appendChild(btnVerAlbum);
            albumdiv.appendChild(formulario2);
            
            
        //verificar si el nombre coincide con lo que busco pero que no sea igual, solo parecido por las primeras letras
        if (albumObj.name.toLowerCase().indexOf(busqueda) !== -1) {
            Div.appendChild(albumdiv);
        }

        var divmostrador = document.getElementById("mostrador");
            divmostrador.appendChild(Div);

        //document.body.appendChild(Div);


        //var cancionesdiv = document.getElementsByClassName(canciondentrodiv);
        var albumdiv = document.querySelectorAll(".albumdiv");
        if (albumdiv.length == 0){
            document.getElementById("mostrador").innerHTML = "No se ha encontrado ningún album con ese nombre ;( )";
        }
        
    }


</script>
