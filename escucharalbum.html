function cover(album){
var cover = document.createElement("img");
                                                                                                                                              
 cover.setAttribute("src", album.cover);
 cover.setAttribute("height","500px"); 
cover.setAttribute("width","500px"); 

document.body.appendChild(cover);

}

function crearObjetoCancion(song){

//audio.setAttribute("controls","controls");

 audio.setAttribute("src",song.source);
return audio;
//document.body.appendChild(audio);
}

function albumCanciones(songs){

        Div.id = 'DivId';

    //cancion(obj);

}

document.body.appendChild(Div);

}
